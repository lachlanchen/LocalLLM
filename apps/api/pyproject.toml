[project]
name = "localllm-api"
version = "0.1.0"
description = "OpenAI-compatible gateway and orchestration API for LocalLLM Studio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.29,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
  "ddgs>=9,<10",
  "trafilatura>=2,<3",
]

[project.optional-dependencies]
dev = [
  "openai>=1.109,<2",
  "playwright>=1.60,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localllm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240", "B008", "E501"]
